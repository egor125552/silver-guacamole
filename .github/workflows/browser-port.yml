name: Browser port

on:
  pull_request:
    paths:
      - 'web/**'
      - 'sounds/**'
      - 'config.ini'
      - 'Запустить браузерную игру.command'
      - '.github/workflows/browser-port.yml'
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'sounds/**'
      - 'config.ini'
      - 'Запустить браузерную игру.command'
      - '.github/workflows/browser-port.yml'

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find web/js -type f -name '*.js' -print0)
      - name: Run gameplay smoke tests
        run: |
          node --experimental-default-type=module web/tests/smoke.mjs
          node --experimental-default-type=module web/tests/campaign-playthrough.mjs
          node --experimental-default-type=module web/tests/campaign-randomized.mjs
      - name: Verify original sound set
        shell: bash
        run: |
          set -euo pipefail
          count=$(find sounds -type f -name '*.ogg' | wc -l | tr -d ' ')
          test "$count" = "18"
      - name: Package complete browser game
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p package/'Stealth Action Web'
          cp -R web sounds package/'Stealth Action Web'/
          cp config.ini package/'Stealth Action Web'/
          cp 'Запустить браузерную игру.command' package/'Stealth Action Web'/'Запустить игру.command'
          chmod +x package/'Stealth Action Web'/'Запустить игру.command'
          cd package
          zip -qr 'Stealth Action Web — 20 минут.zip' 'Stealth Action Web'
      - name: Upload complete browser game
        uses: actions/upload-artifact@v4
        with:
          name: Stealth-Action-Web
          path: package/Stealth Action Web — 20 минут.zip
          if-no-files-found: error
          retention-days: 14
