name: Browser port

on:
  pull_request:
    paths:
      - 'web/**'
      - 'sounds/**'
      - 'config.ini'
      - 'Запустить браузерную игру.command'
      - '.github/workflows/browser-port.yml'
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'sounds/**'
      - 'config.ini'
      - 'Запустить браузерную игру.command'
      - '.github/workflows/browser-port.yml'

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find web/js -type f -name '*.js' -print0)
      - name: Run gameplay smoke tests
        run: |
          node --experimental-default-type=module web/tests/smoke.mjs
          node --experimental-default-type=module web/tests/campaign-playthrough.mjs
          node --experimental-default-type=module web/tests/campaign-randomized.mjs
      - name: Verify original sound set
        shell: bash
        run: |
          set -euo pipefail
          count=$(find sounds -type f -name '*.ogg' | wc -l | tr -d ' ')
          test "$count" = "18"
      - name: Package complete browser game
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p package/'Stealth Action Web'
          cp -R web sounds package/'Stealth Action Web'/
          cp config.ini package/'Stealth Action Web'/
          cp 'Запустить браузерную игру.command' package/'Stealth Action Web'/'Запустить игру.command'
          chmod +x package/'Stealth Action Web'/'Запустить игру.command'
          python3 - <<'PY'
          from pathlib import Path
          import stat
          import zipfile

          package = Path('package')
          root = package / 'Stealth Action Web'
          output = package / 'Stealth Action Web — 20 минут.zip'
          with zipfile.ZipFile(output, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=9) as archive:
              for path in sorted([root, *root.rglob('*')], key=lambda p: p.as_posix()):
                  archive.write(path, path.relative_to(package).as_posix())

          expected = 'Stealth Action Web/Запустить игру.command'
          with zipfile.ZipFile(output) as archive:
              names = set(archive.namelist())
              if expected not in names:
                  raise SystemExit(f'Missing Unicode launcher name: {expected}')
              mode = archive.getinfo(expected).external_attr >> 16
              if not (mode & stat.S_IXUSR):
                  raise SystemExit('Launcher lost executable permission in ZIP')
              ogg_count = sum(name.endswith('.ogg') for name in names)
              if ogg_count != 18:
                  raise SystemExit(f'Expected 18 OGG files in package, got {ogg_count}')
          print(f'Validated package: {output}')
          PY
      - name: Upload complete browser game
        uses: actions/upload-artifact@v4
        with:
          name: Stealth-Action-Web
          path: package/Stealth Action Web — 20 минут.zip
          if-no-files-found: error
          retention-days: 14
